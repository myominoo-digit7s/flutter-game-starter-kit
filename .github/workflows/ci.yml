name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Flutter project
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: 3.41.2
          cache: true

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      # Existing whole-tree formatting debt is reported without blocking CI.
      # Keep the check visible so contributors can fix files they touch.
      - name: Check Dart formatting (advisory while baseline debt remains)
        run: dart format --output=none --set-exit-if-changed .
        continue-on-error: true

      - name: Analyze Dart and Flutter code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build Android debug APK
        run: flutter build apk --debug
